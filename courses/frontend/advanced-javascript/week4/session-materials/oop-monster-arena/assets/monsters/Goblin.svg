<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Goblin">
  <!-- Shadow -->
  <ellipse cx="100" cy="196" rx="38" ry="6" fill="#000" opacity="0.25"/>

  <!-- Legs -->
  <line x1="85" y1="165" x2="78" y2="192" stroke="#1a7a3c" stroke-width="14" stroke-linecap="round"/>
  <line x1="115" y1="165" x2="122" y2="192" stroke="#1a7a3c" stroke-width="14" stroke-linecap="round"/>

  <!-- Body — hunched forward -->
  <ellipse cx="100" cy="138" rx="33" ry="38" fill="#27ae60"/>
  <!-- Tattered vest -->
  <ellipse cx="100" cy="145" rx="22" ry="26" fill="#5d4037" opacity="0.55"/>

  <!-- Left arm — reaching out -->
  <path d="M 68,120 Q 40,128 32,148" stroke="#27ae60" stroke-width="13" fill="none" stroke-linecap="round"/>
  <!-- Left hand claws -->
  <line x1="32" y1="148" x2="22" y2="142" stroke="#1a7a3c" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="148" x2="24" y2="153" stroke="#1a7a3c" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="148" x2="26" y2="160" stroke="#1a7a3c" stroke-width="3" stroke-linecap="round"/>

  <!-- Right arm — raised, holding dagger -->
  <path d="M 132,118 Q 158,105 162,85" stroke="#27ae60" stroke-width="13" fill="none" stroke-linecap="round"/>
  <!-- Dagger grip -->
  <rect x="155" y="62" width="10" height="22" rx="2" fill="#5d4037" transform="rotate(20,160,73)"/>
  <!-- Dagger guard -->
  <rect x="149" y="72" width="20" height="5" rx="2" fill="#95a5a6" transform="rotate(20,159,74)"/>
  <!-- Dagger blade -->
  <polygon points="159,58 163,56 156,24" fill="#bdc3c7" transform="rotate(20,159,41)"/>
  <polygon points="159,58 157,60 156,24" fill="#ecf0f1" opacity="0.8" transform="rotate(20,159,41)"/>

  <!-- Neck -->
  <ellipse cx="100" cy="102" rx="16" ry="14" fill="#27ae60"/>

  <!-- Head -->
  <ellipse cx="100" cy="72" rx="34" ry="30" fill="#2ecc71"/>

  <!-- Big pointy ears -->
  <polygon points="66,68 40,42 70,80" fill="#2ecc71"/>
  <polygon points="68,70 44,46 68,76" fill="#c0392b" opacity="0.5"/>
  <polygon points="134,68 160,42 130,80" fill="#2ecc71"/>
  <polygon points="132,70 156,46 132,76" fill="#c0392b" opacity="0.5"/>

  <!-- Brow ridge — angry -->
  <path d="M 80,58 Q 90,52 100,54 Q 110,52 120,58" stroke="#1a7a3c" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Eyes — glowing yellow, mean -->
  <ellipse cx="89" cy="66" rx="8" ry="7" fill="#f1c40f"/>
  <ellipse cx="111" cy="66" rx="8" ry="7" fill="#f1c40f"/>
  <circle cx="91" cy="67" r="4" fill="#c0392b"/>
  <circle cx="113" cy="67" r="4" fill="#c0392b"/>
  <circle cx="92" cy="66" r="1.5" fill="#111"/>
  <circle cx="114" cy="66" r="1.5" fill="#111"/>
  <!-- Eye glint -->
  <circle cx="87" cy="64" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="109" cy="64" r="1.5" fill="white" opacity="0.7"/>

  <!-- Nose — flat, wide -->
  <ellipse cx="100" cy="78" rx="7" ry="5" fill="#1a7a3c"/>
  <circle cx="96" cy="79" r="2" fill="#145a32"/>
  <circle cx="104" cy="79" r="2" fill="#145a32"/>

  <!-- Mouth — jagged grin -->
  <path d="M 84,87 Q 92,95 100,93 Q 108,95 116,87" fill="#145a32" stroke="#145a32" stroke-width="1"/>
  <!-- Teeth -->
  <polygon points="89,88 93,88 91,95" fill="white"/>
  <polygon points="97,89 101,89 99,95" fill="white"/>
  <polygon points="107,88 111,88 109,95" fill="white"/>
  <!-- Fangs -->
  <polygon points="84,87 88,87 86,94" fill="white"/>
  <polygon points="112,87 116,87 114,94" fill="white"/>
</svg>
