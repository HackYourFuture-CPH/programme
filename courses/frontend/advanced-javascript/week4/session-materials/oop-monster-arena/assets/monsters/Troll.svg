<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Troll">
  <!-- Shadow -->
  <ellipse cx="100" cy="197" rx="52" ry="6" fill="#000" opacity="0.3"/>

  <!-- Club (behind body) -->
  <!-- Club handle -->
  <rect x="24" y="90" width="10" height="70" rx="5" fill="#5d4037" transform="rotate(-25,29,125)"/>
  <!-- Club head -->
  <ellipse cx="18" cy="80" rx="18" ry="22" fill="#4a3728" transform="rotate(-25,18,80)"/>
  <!-- Club spikes/knots -->
  <circle cx="12" cy="68" r="6" fill="#3e2723"/>
  <circle cx="24" cy="62" r="5" fill="#3e2723"/>
  <circle cx="10" cy="83" r="5" fill="#3e2723"/>

  <!-- Legs — thick, short -->
  <ellipse cx="82" cy="182" rx="20" ry="14" fill="#546e7a"/>
  <ellipse cx="118" cy="182" rx="20" ry="14" fill="#546e7a"/>
  <line x1="86" y1="165" x2="82" y2="188" stroke="#4a5c63" stroke-width="22" stroke-linecap="round"/>
  <line x1="114" y1="165" x2="118" y2="188" stroke="#4a5c63" stroke-width="22" stroke-linecap="round"/>

  <!-- Body — massive, boulder-like -->
  <ellipse cx="100" cy="132" rx="58" ry="50" fill="#607d8b"/>
  <!-- Body rock texture -->
  <ellipse cx="85" cy="120" rx="15" ry="10" fill="#78909c" opacity="0.5"/>
  <ellipse cx="115" cy="145" rx="12" ry="8" fill="#78909c" opacity="0.4"/>
  <ellipse cx="95" cy="155" rx="18" ry="8" fill="#546e7a" opacity="0.5"/>
  <!-- Moss patches -->
  <ellipse cx="72" cy="140" rx="14" ry="9" fill="#2e7d32" opacity="0.7"/>
  <ellipse cx="125" cy="130" rx="10" ry="7" fill="#388e3c" opacity="0.65"/>
  <ellipse cx="100" cy="170" rx="16" ry="7" fill="#2e7d32" opacity="0.6"/>

  <!-- Left arm — hanging heavy -->
  <path d="M 44,120 Q 28,145 35,170" stroke="#546e7a" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- Left hand -->
  <ellipse cx="36" cy="172" rx="16" ry="12" fill="#546e7a"/>
  <line x1="24" y1="172" x2="18" y2="185" stroke="#4a5c63" stroke-width="5" stroke-linecap="round"/>
  <line x1="32" y1="176" x2="28" y2="190" stroke="#4a5c63" stroke-width="5" stroke-linecap="round"/>
  <line x1="42" y1="178" x2="40" y2="192" stroke="#4a5c63" stroke-width="5" stroke-linecap="round"/>

  <!-- Right arm — raised, holding club -->
  <path d="M 156,118 Q 168,100 158,82" stroke="#546e7a" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- Right hand -->
  <ellipse cx="156" cy="80" rx="14" ry="11" fill="#546e7a"/>

  <!-- Neck — thick -->
  <ellipse cx="100" cy="92" rx="26" ry="18" fill="#607d8b"/>

  <!-- Head — wide, heavy browed -->
  <ellipse cx="100" cy="66" rx="42" ry="36" fill="#607d8b"/>

  <!-- Head rock texture -->
  <ellipse cx="118" cy="55" rx="10" ry="6" fill="#78909c" opacity="0.4"/>
  <!-- Moss on head -->
  <ellipse cx="80" cy="40" rx="14" ry="7" fill="#2e7d32" opacity="0.65"/>
  <ellipse cx="100" cy="35" rx="10" ry="5" fill="#388e3c" opacity="0.5"/>

  <!-- Heavy brow ridge -->
  <path d="M 62,62 Q 80,50 100,52 Q 120,50 138,62" fill="#546e7a" stroke="#546e7a" stroke-width="1"/>

  <!-- Eyes — small, beady, greenish glow -->
  <ellipse cx="87" cy="65" rx="7" ry="6" fill="#1b5e20"/>
  <ellipse cx="113" cy="65" rx="7" ry="6" fill="#1b5e20"/>
  <circle cx="88" cy="66" r="3.5" fill="#4caf50"/>
  <circle cx="114" cy="66" r="3.5" fill="#4caf50"/>
  <circle cx="88" cy="65" r="1.5" fill="#111"/>
  <circle cx="114" cy="65" r="1.5" fill="#111"/>
  <!-- Glowing regen aura in eyes -->
  <circle cx="86" cy="63" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="112" cy="63" r="1.2" fill="white" opacity="0.6"/>

  <!-- Broad flat nose -->
  <ellipse cx="100" cy="77" rx="12" ry="8" fill="#546e7a"/>
  <circle cx="93" cy="78" r="3.5" fill="#455a64"/>
  <circle cx="107" cy="78" r="3.5" fill="#455a64"/>

  <!-- Mouth — wide, dumb grin -->
  <path d="M 76,87 Q 100,100 124,87" fill="#455a64" stroke="#455a64" stroke-width="1"/>
  <!-- Broad teeth -->
  <rect x="83" y="87" width="10" height="8" rx="2" fill="#ecf0f1"/>
  <rect x="95" y="88" width="10" height="8" rx="2" fill="#ecf0f1"/>
  <rect x="107" y="87" width="10" height="8" rx="2" fill="#ecf0f1"/>
  <!-- Bottom snaggleteeth -->
  <polygon points="88,95 92,95 90,102" fill="#d5d8dc"/>
  <polygon points="108,95 112,95 110,102" fill="#d5d8dc"/>

  <!-- Regen glow aura — subtle green pulse ring -->
  <ellipse cx="100" cy="120" rx="62" ry="54" fill="none" stroke="#4caf50" stroke-width="2" opacity="0.25"/>
  <ellipse cx="100" cy="120" rx="68" ry="60" fill="none" stroke="#66bb6a" stroke-width="1" opacity="0.15"/>
</svg>
